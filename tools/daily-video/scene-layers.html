<script>const E=t=>1-Math.pow(1-Math.min(1,Math.max(0,t)),3);const $=id=>document.getElementById(id);
function show(id,a,b,t){const e=$(id);let o=0;if(t>=a-.01&&t<b){o=Math.min(E((t-a)/.4),(b-t)<.35?(b-t)/.35:1)}e.style.opacity=o;e.style.transform=`translateY(${(1-E((t-a)/.5))*30}px)`;return t>=a&&t<b}
async function loadFrames(d,nf){const FR=[];for(let i=0;i<nf;i++){const im=new Image();im.src=`../../_dv_tmp/${d.id}/${String(i).padStart(3,'0')}.png`;FR.push(im)}await Promise.all([...FR.map(im=>im.decode().catch(()=>{})),document.fonts.ready]);return FR}
function draw(cv,im){const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height)}

let FR=[],D,M,G;window.DUR=15.4;
window.init=async(d,nf,meta)=>{D=d;M=meta;$('nm').textContent=d.name;FR=await loadFrames(d,nf);G=Math.round(nf*0.7);
 $('note').textContent=`ارتفاع القطعة نحو ${Math.round(meta.box.h)} مم · عدد الطبقات تقريبي بطبقة 0.2 مم`;$('pp').innerHTML=`${d.name}<br><b class="gold">${d.price[0]} ريال</b>`};
window.setT=t=>{show('a',0,2.0,t);const on=show('b',2.0,12.6,t);show('c',12.6,15.4,t);
 if(on){const gt=6.4,u=(t-2.0)/(12.6-2.0);let i,pr;if(t<2.0+gt){const q=(t-2.0)/gt;i=Math.min(G-1,Math.floor(q*G));pr=q}else{const q=(t-2.0-gt)/(12.6-2.0-gt);i=Math.min(FR.length-1,G+Math.floor(q*(FR.length-G)));pr=1}
  draw($('cv'),FR[i]);$('bar').style.width=(pr*100)+'%';const L=M.layers;$('ly').textContent=`${Math.min(L,Math.ceil(pr*L))} / ${L}`}};
</script>
