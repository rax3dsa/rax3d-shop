<script>const E=t=>1-Math.pow(1-Math.min(1,Math.max(0,t)),3);const $=id=>document.getElementById(id);
function show(id,a,b,t){const e=$(id);let o=0;if(t>=a-.01&&t<b){o=Math.min(E((t-a)/.4),(b-t)<.35?(b-t)/.35:1)}e.style.opacity=o;e.style.transform=`translateY(${(1-E((t-a)/.5))*30}px)`;return t>=a&&t<b}
async function loadFrames(d,nf){const FR=[];for(let i=0;i<nf;i++){const im=new Image();im.src=`../../_dv_tmp/${d.id}/${String(i).padStart(3,'0')}.png`;FR.push(im)}await Promise.all([...FR.map(im=>im.decode().catch(()=>{})),document.fonts.ready]);return FR}
function draw(cv,im){const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height)}

let FR=[],D,M;window.DUR=14.6;
window.init=async(d,nf,meta)=>{D=d;M=meta;$('nm').textContent=d.name;$('sub').textContent=`متوفرة بـ ${meta.colors.length} لونًا`;FR=await loadFrames(d,nf);
 $('sw').innerHTML=meta.colors.map(c=>`<i style="width:44px;height:44px;border-radius:50%;background:${c.h||'#ccc'};border:4px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.2)"></i>`).join('');
 $('pr').innerHTML=`السعر <b class="gold">${d.price[0]} ريال</b> · لونها حسب اختيارك`};
window.setT=t=>{show('a',0,2.3,t);const on=show('b',2.3,12.4,t);show('c',12.4,14.6,t);
 if(on){const u=Math.min(.999,(t-2.3)/(12.4-2.3)),i=Math.floor(u*FR.length);draw($('cv'),FR[i]);const k=Math.min(M.colors.length-1,Math.floor(u*M.colors.length)),c=M.colors[k];$('cn').textContent=c.n;$('dot').style.background=c.h||'#ccc';
  [...$('sw').children].forEach((s,j)=>{s.style.transform=j===k?'scale(1.35)':'scale(1)';s.style.opacity=j===k?1:.6})}};
</script>
